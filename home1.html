<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pittsfield, MA Home Page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f3f0;
        color: #2d1b0f;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2.5rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        color: #4a3528;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pittsfield, MA Home Page</h1>
      <p>Welcome! This site is a comparison of AI-generated, early-internet-style homepages for the town of Pittsfield, Massachusetts.</p>
      <p><a href="index.html">Enter the contest</a></p>
      <p id="today"></p>
    </main>
    <script>
      document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    </script>
  </body>
</html>
